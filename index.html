<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- Chống zoom, hiển thị như app thật -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chi Phi SR">
  <meta name="theme-color" content="#1b5e20">
  <meta name="description" content="Quan ly chi phi lam vuon SR2526">

  <title>Chi Phi SR2526</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b5e20;
      font-family: 'Nunito', 'Segoe UI', sans-serif;
    }

    /* ── WRAPPER che banner Google ── */
    .iframe-wrapper {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
    }

    .iframe-wrapper iframe {
      width: 100%;
      /* Đẩy lên để che banner "Ứng dụng này do một người dùng Google tạo" */
      margin-top: -45px;
      height: calc(100% + 45px);
      border: none;
      display: block;
      background: #f0f5f0;
    }

    /* ── LOADING SCREEN ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 55%, #43a047 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* Icon trang trí */
    .loading-icon {
      width: 90px;
      height: 90px;
      background: rgba(255,255,255,0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .loading-icon svg {
      width: 56px;
      height: 56px;
    }

    /* Spinner vòng tròn xoay */
    .spinner-ring {
      width: 56px;
      height: 56px;
      position: relative;
    }

    .spinner-ring::before,
    .spinner-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }

    .spinner-ring::before {
      inset: 0;
      border: 5px solid rgba(255,255,255,0.2);
    }

    .spinner-ring::after {
      inset: 0;
      border: 5px solid transparent;
      border-top-color: #ffffff;
      border-right-color: #a5d6a7;
      animation: spin 0.85s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      color: white;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .loading-sub {
      color: rgba(255,255,255,0.65);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      margin-top: -14px;
    }

    /* Dot loading animation */
    .loading-dots span {
      display: inline-block;
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="loading-icon">
      <!-- SVG icon cây/lá làm vườn -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Thân cây -->
        <rect x="29" y="36" width="6" height="20" rx="3" fill="#8d6e63"/>
        <!-- Lá trái -->
        <ellipse cx="18" cy="30" rx="14" ry="10" fill="#66bb6a" transform="rotate(-20 18 30)"/>
        <!-- Lá giữa -->
        <ellipse cx="32" cy="20" rx="14" ry="11" fill="#43a047"/>
        <!-- Lá phải -->
        <ellipse cx="46" cy="30" rx="14" ry="10" fill="#66bb6a" transform="rotate(20 46 30)"/>
        <!-- Điểm sáng lá -->
        <ellipse cx="32" cy="18" rx="6" ry="4" fill="#a5d6a7" opacity="0.5"/>
      </svg>
    </div>

    <div class="spinner-ring"></div>

    <div>
      <div class="loading-title">QUAN LY CHI PHI SR2526</div>
      <div class="loading-sub">Dang khoi dong ung dung</div>
    </div>

    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- IFRAME WRAPPER (che banner Google) -->
  <div class="iframe-wrapper">
    <iframe
      id="main-app"
      src="https://script.google.com/macros/s/AKfycbzSQDZSRXqPnOJoR5hrVJ-PHHrbgWd4iR17e9thVJi_T48RjHssN5Flloy4a2VFj21ZNg/exec"
      allowfullscreen
      loading="eager"
    ></iframe>
  </div>

  <script>
    // Service Worker đăng ký PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }

    // Ẩn loading khi iframe tải xong (fade-out mượt)
    const iframe = document.getElementById('main-app');
    const loadingScreen = document.getElementById('loading-screen');

    let hideTimeout;

    function hideLoading() {
      clearTimeout(hideTimeout);
      loadingScreen.classList.add('fade-out');
      // Xoá khỏi DOM sau khi animation xong
      setTimeout(() => {
        loadingScreen.style.display = 'none';
      }, 650);
    }

    iframe.addEventListener('load', () => {
      // Delay nhỏ để app bên trong kịp render
      hideTimeout = setTimeout(hideLoading, 800);
    });

    // Fallback: nếu sau 12 giây vẫn chưa load xong thì cũng ẩn loading
    setTimeout(hideLoading, 12000);
  </script>
</body>
</html>
